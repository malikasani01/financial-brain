  <path d="M120 388 C 214 388, 258 300, 306 250 C 354 200, 372 168, 402 156"
        fill="none" stroke="#8FA99A" stroke-width="24" stroke-linecap="round" opacity="0.55"/>
  <!-- main growth path: from where you are, rising toward your goal -->
